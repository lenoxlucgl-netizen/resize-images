version: '3.8'
services:
  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres
      - MINIO_ENDPOINT=http://minio:9000
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - minio
      - redis

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniosecret
    volumes:
      - minio_data:/data

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: storage_platform
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine

volumes:
  minio_data:
  pg_data: