version: '3.8'

services:
  app:
    build: .
    container_name: resize_image_app
    ports:
      - "3003:3003"
    env_file:
      - .env.docker
    depends_on:
      - mysql
      - minio
      - redis

  mysql:
    image: mysql:8.0
    container_name: resize_image_mysql
    ports:
      - "3306:3306"
    env_file:
      - .env.docker
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: resize_image_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env.docker
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    container_name: resize_image_minio_init
    env_file:
      - .env.docker
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      /usr/bin/mc mb myminio/$$MINIO_BUCKET || true;
      /usr/bin/mc anonymous set public myminio/$$MINIO_BUCKET || true;
      exit 0;
      "

  redis:
    image: redis:alpine
    container_name: resize_image_redis
    ports:
      - "6379:6379"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: resize_image_phpmyadmin
    ports:
      - "8080:80"
    env_file:
      - .env.docker
    depends_on:
      - mysql
